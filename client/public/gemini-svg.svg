<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%" fill="none">
  <!-- Brand Icon -->
  <g transform="translate(10, 10)">
    <!-- Land Plot Boundary (Polygon Background) -->
    <polygon points="50,10 85,35 75,85 25,85 15,35" fill="none" stroke="#0F2C59" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Geometric Mountain Peak Intertwined -->
    <path d="M25,85 L50,28 L75,85" stroke="#00A88F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M40,85 L50,60 L60,85" stroke="#0F2C59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Blockchain Nodes at Vertices -->
    <circle cx="50" cy="10" r="5" fill="#00A88F" />
    <circle cx="85" cy="35" r="5" fill="#0F2C59" />
    <circle cx="75" cy="85" r="5" fill="#00A88F" />
    <circle cx="25" cy="85" r="5" fill="#0F2C59" />
    <circle cx="15" cy="35" r="5" fill="#00A88F" />
    
    <!-- Central Verification Node -->
    <circle cx="50" cy="28" r="4" fill="#0F2C59" />
    <line x1="50" y1="10" x2="50" y2="28" stroke="#00A88F" stroke-width="2" stroke-dasharray="2,2" />
  </g>

  <!-- Typography -->
  <text x="120" y="70" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="46" letter-spacing="-1">
    <tspan fill="#00A88F">D</tspan><tspan fill="#0F2C59">Malpot</tspan>
  </text>
  
  <!-- Subtitle / Tagline -->
  <text x="122" y="92" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748B" letter-spacing="3">
    DECENTRALIZED LAND REGISTRY
  </text>
</svg>
